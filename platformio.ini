; CC1101 433 MHz capture and replay (ESP32-C3 Super Mini)
; pio run -e esp32c3 -t upload
; pio device monitor

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Opening the port with DTR/RTS set holds this chip in reset, so the
; sketch never runs and the monitor stays blank.
monitor_dtr = 0
monitor_rts = 0
; The default 8.4 toolchain package is an Intel binary marked as arm64.
; This Mac has no Rosetta, so use the native Apple Silicon compiler.
platform_packages =
    toolchain-riscv32-esp@12.2.0+20230208
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -misa-spec=2.2
